<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampuer</title>
  <style>
    html, body {
      height: 100%;
      background: #fafafb;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #232323;
    }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    main {
      background: #fff;
      box-shadow: 0px 4px 32px rgba(40,40,60,0.03);
      border-radius: 20px;
      padding: 48px 36px;
      min-width: 320px;
      max-width: 95vw;
      text-align: center;
      transition: box-shadow 0.2s;
    }
    main:hover {
      box-shadow: 0px 8px 44px rgba(73,63,140,0.07);
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 600;
      margin-bottom: 0.6em;
      letter-spacing: -0.03em;
    }
    p {
      font-size: 1.1rem;
      color: #6a6a7a;
      margin: 0 0 1.8em;
    }
    nav {
      margin-top: 1.5em;
      display: flex;
      gap: 0.7em;
      justify-content: center;
      flex-wrap: wrap;
    }
    nav a {
      display: inline-block;
      font-weight: 500;
      letter-spacing: 0.01em;
      text-decoration: none;
      background: #f3f3f8;
      color: #232323;
      border-radius: 14px;
      padding: 0.7em 1.6em;
      font-size: 1rem;
      transition: background .2s, color .2s;
    }
    nav a:hover, nav a:focus {
      background: #232323;
      color: #fff;
    }
    footer {
      margin-top: 40px;
      font-size: 0.93em;
      color: #bcbcd0;
      letter-spacing: 0.04em;
    }
    @media (max-width: 600px) {
      main {
        padding: 26px 10px;
        min-width: 0;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Ampuer</h1>
    <p>Hola, soy Ampuer.<br>
      Bienvenido/a a mi sitio personal minimalista.<br>
      Conoce más sobre mí, mis proyectos o cómo contactarme.
    </p>
    <nav>
      <a href="#sobre">Sobre mí</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </main>
  <footer>
    &copy; 2026 Ampuer
  </footer>
</body>
</html>
